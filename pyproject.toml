[project]
name = "multi-agent-workflow"
version = "0.1.0"
description = "An open-source multi-agent workflow framework for K-12 education built with LangGraph and OpenAI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.1.10",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "openai>=2.35.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
